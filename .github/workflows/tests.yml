name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # xdotool/scrot/xclip + a virtual display let the FedoraAgent tests
      # (tests/test_fedora_agent.py) run for real instead of skipping — see
      # docs/DEVICES.md. xterm + x11-apps (xclock) are test fixtures only
      # (something for click/type/open/close tests to interact with), not
      # a FedoraAgent runtime dependency.
      - run: sudo apt-get update && sudo apt-get install -y xvfb xdotool scrot xclip xterm x11-apps
      - run: pip install -e ".[dev]"
      # Real Chromium binary + its OS deps, so tests/test_browser_playwright.py
      # exercises PlaywrightBrowserAgent for real instead of skipping — see
      # docs/BROWSER.md.
      - run: python -m playwright install --with-deps chromium
      - run: xvfb-run -a python -m pytest -q
