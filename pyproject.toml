[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kanna"
version = "0.1.0"
description = "Kanna — a personal AI work-execution agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
# Real Anthropic-backed LLM provider. Core works without it (rule-based
# planner + finance NLP are pure stdlib and always available).
llm = ["anthropic>=0.40"]
# Anthropic-vision-backed OCR/receipt extraction (vision/ocr,
# vision/document). Needs the same 'anthropic' package as the llm extra;
# listed again here so `pip install kanna[vision]` alone is sufficient.
# 'pillow' isn't imported by any Phase 2 code yet but is kept for planned
# image-editing/validation work.
vision = ["anthropic>=0.40", "pillow"]
# Future subsystems — not wired up yet, listed so `pip install
# kanna[browser]` etc. has somewhere to grow into.
browser = ["playwright"]
docs = ["python-docx", "pypdf"]
dev = ["pytest>=8"]

[project.scripts]
kanna = "main:main"

[tool.setuptools.packages.find]
include = ["core*", "tools*", "finance*", "automation*", "interfaces*", "vision*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
